<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Fechas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #8fa7c2, #6f8fb5);
}

.navbar {
  background-color: rgba(111, 143, 179, 0.95);
  padding: 15px 30px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar a {
  color: white;
  margin-right: 18px;
  text-decoration: none;
}

.logo {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.titulo {
  text-align: center;
  margin: 15px;
}

.titulo span {
  background: linear-gradient(135deg, #355c8a, #27496d);
  padding: 12px 35px;
  border-radius: 30px;
  color: white;
}

.contenedor {
  padding: 20px;
}

.card {
  background: rgba(94, 127, 166, 0.95);
  padding: 20px;
  border-radius: 18px;
  color: white;
}

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

th {
  background: #355c8a;
  color: white;
}

.filtros {
  margin-bottom: 10px;
}

button {
  padding: 8px 12px;
  margin-right: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.export {
  position: fixed;
  bottom: 20px;
  right: 20px;
}

td {
  color: black;
}
</style>
</head>

<body>

<div class="navbar">
  <div>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Inventario</a>
    <a href="#">Ventas</a>
    <a href="#">Proveedores</a>
    <a href="#">Reportes</a>
    <a href="#">Usuarios</a>
    <a href="#">Configuracion</a>
  </div>
  <img src="img/LogoPharmatodo.jpeg" class="logo">
</div>

<div class="titulo">
  <span>Registro de Fechas</span>
</div>

<div class="contenedor">

<div class="card">

  <div class="filtros">
    <button onclick="filtrar('todos')">Todos</button>
    <button onclick="filtrar('proveedor')">Proveedores</button>
    <button onclick="filtrar('venta')">Ventas</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Fecha</th>
        <th>Detalle</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

</div>

</div>

<div class="export">
  <button onclick="exportar()">Exportar</button>
</div>

<script>

let registros = [];

async function cargar() {
  const res = await fetch("https://jsonplaceholder.typicode.com/posts");
  const data = await res.json();

  registros = data.slice(0, 15).map((item, i) => {

    let tipo = i % 2 === 0 ? "proveedor" : "venta";

    let fecha = new Date();
    fecha.setDate(fecha.getDate() - i);

    return {
      tipo,
      fecha: fecha.toLocaleDateString(),
      detalle: tipo === "venta"
        ? `Venta de medicamento: Dolex / Ibuprofeno / Paracetamol`
        : `Pedido a proveedor farmacéutico (${item.title.slice(0, 25)})`
    };
  });

  mostrar(registros);
}

function mostrar(data) {
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  data.forEach(r => {
    tabla.innerHTML += `
      <tr>
        <td>${r.tipo}</td>
        <td>${r.fecha}</td>
        <td>${r.detalle}</td>
      </tr>
    `;
  });
}

function filtrar(tipo) {
  if (tipo === "todos") return mostrar(registros);

  const filtrados = registros.filter(r => r.tipo === tipo);
  mostrar(filtrados);
}

function exportar() {
  alert("Exportando registro...");
}

cargar();

</script>

</body>
</html>
