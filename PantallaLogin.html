<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pharmatodo - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #8fa7c2, #6f8fb5);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

    .container {
      text-align: center;
      padding-top: 50px;
    }

    .logo { width: 120px; 
      height: 120px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 3px solid white; 
      box-shadow: 0px 4px 8px rgba(0,0,0,0.3); }

    .login-box {
  background-color: rgba(94, 127, 166, 0.95);
  width: 340px;
  padding: 35px;
  border-radius: 16px;
  color: white;
  box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
  backdrop-filter: blur(5px);
}

    .login-box h2 {
      margin: 0;
    }

    .login-box input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: none;
  border-radius: 8px;
  background-color: rgba(255,255,255,0.15);
  color: white;
  outline: none;
  font-size: 14px;
}

.login-box input:focus {
  border: 1px solid white;
}

    .login-box input::placeholder {
      color: #ddd;
    }

    .login-box button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #355c8a, #27496d);
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  margin-top: 15px;
  font-size: 15px;
  transition: 0.3s;
}

    .login-box button:hover {
  transform: scale(1.03);
  background: linear-gradient(135deg, #27496d, #1b2f4b);
}

    .login-box a {
      color: #fff;
      text-decoration: underline;
    }

    hr {
      margin: 15px 0;
      border: 0.5px solid #ccc;
    }
  </style>

</head>
<body>

  <div class="container">
    
   
    <img src="img/LogoPharmatodo.jpeg" alt="Logo Pharmatodo" class="logo">

    <div class="login-box">
      <h2>PHARMATODO</h2>
      <p>Sistema de gestión farmacia</p>

      <input type="text" placeholder="Usuario o correo">
      <input type="password" placeholder="Contraseña">

      <button onclick="iniciarSesion()">Iniciar sesión</button>

      <hr>

      <p>¿No tienes una cuenta?</p>
      <a href="#">Registrarse</a>
    </div>

  </div>

  <script>
    function iniciarSesion() {
      alert("Inicio de sesión exitoso (simulado)");
      
    }
  </script>

</body>
</html>
