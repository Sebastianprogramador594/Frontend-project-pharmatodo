<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmatodo - Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #8fa7c2, #6f8fb5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      color: #34495e;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 18px;
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .brand-title {
      color: white;
      font-size: 27px;
      font-weight: 600;
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      margin-top: 3px;
    }

    .login-box {
      background: white;
      width: 100%;
      padding: 35px;
      margin-top: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.14);
    }

    .login-box h2 {
      color: #34495e;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-description {
      color: #7b8794;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      color: #536273;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d7dee7;
      border-radius: 8px;
      background: #ffffff;
      color: #34495e;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      transition: 0.2s;
    }

    .login-box input:focus {
      border-color: #6f8fb5;
      box-shadow: 0 0 0 3px rgba(111, 143, 181, 0.12);
    }

    .login-box input::placeholder {
      color: #a1aab4;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #6f8fb5;
      border: none;
      border-radius: 9px;
      color: white;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
    }

    .login-box button:hover {
      background: #5f7fa5;
      transform: translateY(-1px);
    }

    .login-box button:active {
      transform: translateY(0);
    }

    #mensaje {
      margin: 12px 0 4px;
      font-size: 12px;
      min-height: 18px;
      color: #bd3e3e;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 23px 0 18px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #e5e9ee;
    }

    .divider span {
      color: #9aa5b1;
      font-size: 11px;
    }

    .register-text {
      color: #7b8794;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .register-link {
      color: #6f8fb5;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .register-link:hover {
      color: #526f91;
    }

    .footer {
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      margin-top: 18px;
    }

    @media (max-width: 500px) {
      body {
        padding: 18px;
      }

      .login-box {
        padding: 28px 22px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }

      .brand-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="logo-container">
      <img
        src="img/LogoPharmatodo.jpeg"
        alt="Logo Pharmatodo"
        class="logo"
      >

      <div class="brand-title">Pharmatodo</div>
      <div class="brand-subtitle">Sistema de gestión de farmacia</div>
    </div>

    <div class="login-box">

      <h2>Iniciar sesión</h2>

      <p class="login-description">
        Ingresa tus credenciales para acceder al sistema.
      </p>

      <div class="form-group">
        <label for="usuario">Usuario o correo</label>

        <input
          type="text"
          id="usuario"
          placeholder="Ingresa tu usuario o correo"
          onkeydown="if(event.key === 'Enter') document.getElementById('password').focus()"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          onkeydown="if(event.key === 'Enter') iniciarSesion()"
        >
      </div>

      <p id="mensaje"></p>

      <button id="btnIngresar" onclick="iniciarSesion()">
        Iniciar sesión
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span>PHARMATODO</span>
        <div class="divider-line"></div>
      </div>

      <p class="register-text">
        ¿No tienes una cuenta?
      </p>

      <button type="button" onclick="mostrarMensajeRegistro()">
        Registrarse
      </button>

    </div>

    <div class="footer">
      Sistema de gestión y control de farmacia
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    // Si ya existe una sesión activa, redirigir directo al Dashboard
    if (localStorage.getItem("tokenPharmatodo") && localStorage.getItem("usuarioPharmatodo")) {
      window.location.href = "Dashboard.html";
    }

    async function iniciarSesion() {
      const usuario = document.getElementById("usuario").value.trim();
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");
      const btn = document.getElementById("btnIngresar");

      mensaje.textContent = "";

      if (!usuario || !password) {
        mensaje.textContent = "Ingresa usuario y contraseña";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verificando...";

      try {
        const respuesta = await fetch(
          "http://localhost:3000/api/auth/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              usuario: usuario,
              password: password
            })
          }
        );

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          mensaje.textContent = datos.mensaje || "Credenciales incorrectas";
          btn.disabled = false;
          btn.textContent = "Iniciar sesión";
          return;
        }

        localStorage.setItem(
          "usuarioPharmatodo",
          JSON.stringify(datos.usuario)
        );

        localStorage.setItem("tokenPharmatodo", datos.token);

        window.location.href = "Dashboard.html";

      } catch (error) {
        mensaje.textContent =
          "No se pudo conectar con el servidor. Verifica que el backend esté corriendo.";
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    }

    function mostrarMensajeRegistro() {
      alert(
        "El registro de usuarios está administrado por el administrador del sistema.\n\n" +
        "Para ingresar de prueba puedes utilizar las credenciales iniciales:\n" +
        "• Administrador: admin / admin123\n" +
        "• Farmacéutico: farmaceutico / farmacia123"
      );
    }
  </script>

</body>
</html>
