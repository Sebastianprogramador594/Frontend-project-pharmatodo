<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Facturación</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #8fa7c2, #6f8fb5);
}

.navbar {
  background-color: rgba(111, 143, 179, 0.95);
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-right: 15px;
  font-weight: 500;
  transition: 0.3s;
}

.navbar a:hover {
  color: #dce8f5;
}

.logo {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
}

.titulo {
  text-align: center;
  margin: 15px;
}

.titulo span {
  background: linear-gradient(135deg, #355c8a, #27496d);
  padding: 12px 35px;
  border-radius: 30px;
  color: white;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.box {
  width: 420px;
  margin: auto;
  background: rgba(94, 127, 166, 0.95);
  padding: 25px;
  border-radius: 18px;
  color: white;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0 12px;
  border: none;
  border-radius: 10px;
  outline: none;
  font-family: 'Poppins', sans-serif;
  box-sizing: border-box;
}

.factura-item {
  background: rgba(255,255,255,0.15);
  padding: 8px;
  border-radius: 10px;
  margin: 6px 0;
}

.radio-group {
  display: flex;
  gap: 15px;
  margin-top: 5px;
  flex-wrap: wrap;
}

button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #355c8a, #27496d);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 10px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
}

</style>

</head>

<body>

<div class="navbar">
  <div>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Inventario</a>
    <a href="#">Ventas</a>
    <a href="#">Proveedores</a>
    <a href="#">Reportes</a>
    <a href="#">Usuarios</a>
    <a href="#">Configuración</a>
  </div>

  <img src="img/LogoPharmatodo.jpeg" class="logo">
</div>

<div class="titulo">
  <span>Generación de Facturas</span>
</div>

<div class="box">

  Nombre del cliente:
  <input type="text">

  Documento:
  <input type="text">

  Método de pago:
  <select>
    <option>Seleccionar</option>
    <option>Efectivo</option>
    <option>Tarjeta</option>
    <option>Transferencia</option>
  </select>

  <div class="factura-item">
    Dolex 500mg — $8.500 x 2 = $17.000
  </div>

  <div class="factura-item">
    Ibuprofeno 400 — $6.200 x 1 = $6.200
  </div>

  <b>Total: $23.000</b>

  <br><br>

  Tipo de descuento:

  <div class="radio-group">
    <label><input type="radio" name="desc"> Ninguno</label>
    <label><input type="radio" name="desc"> Porcentaje</label>
    <label><input type="radio" name="desc"> Cupón</label>
  </div>

  Valor del descuento:
  <input type="text">

  <button>Generar factura</button>

</div>

</body>
</html>
